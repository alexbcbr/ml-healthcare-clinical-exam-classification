AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for alexa-doctor-guru

Globals:
  Function:
    Timeout: 7

Resources:
  DoctorGuru:
    # Alexa skill which is responsible for bringing a diagnostic for patient
    # Demo for WWPS Mexico Summit
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: check-patient/
      Handler: lambda_function.lambda_handler
      Runtime: python3.7
      Role: arn:aws:iam::771620814942:role/aws-admin
      Layers:
        - Ref: AlexaSDKLayer
      Events:
        AlexaSkillEvent:
          Type: AlexaSkill
  
  AlexaSDKLayer:
    # Libraries for ask-sdk
    Type: 'AWS::Serverless::LayerVersion'
    Properties:
      LayerName: alexa-sdk-python
      Description: ''
      ContentUri: 's3://alexbc.app.dev.us-east-2/lambda-layers.zip'
      CompatibleRuntimes:
        - python3.7
      LicenseInfo: MIT
      RetentionPolicy: Delete

Outputs:
  # Information about lambda function
  DoctorGuruSkill:
    Description: "ARN Alexa Skill for Doctor Guru"
    Value: !GetAtt DoctorGuru.Arn
